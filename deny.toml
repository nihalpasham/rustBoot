# Verify that `cargo deny check` passes before merging.
#
# Usage: cargo deny check

[graph]
# Only check for specific target triples; exclude dev-dependencies.
# Transitive (non-dev) dependencies ARE checked.
targets = [
    { triple = "thumbv7em-none-eabihf" },
    { triple = "thumbv6m-none-eabi" },
    { triple = "aarch64-unknown-none-softfloat" },
]
exclude-dev = true

[advisories]
vulnerability = "deny"
unmaintained = "deny"
notice = "deny"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-DFS-2016",
]
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
    "LGPL-3.0",
    "CC0-1.0",
]
unlicensed = "deny"
confidence-threshold = 0.8
allow-osi-fsf-free = "neither"
default = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []