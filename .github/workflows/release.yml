name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: rustBoot ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

  build-binaries:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv7em-none-eabihf
          - thumbv6m-none-eabi
          - aarch64-unknown-none-softfloat
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: Install flip-link
        run: cargo install flip-link --locked
      - name: Build (${{ matrix.target }})
        run: |
          cargo build --package rustBoot --target ${{ matrix.target }} \
            --features "nistp256,sha256" --release
      - name: Upload binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/${{ matrix.target }}/release/librustBoot.rlib
          asset_name: rustBoot-${{ github.ref_name }}-${{ matrix.target }}.rlib
          asset_content_type: application/octet-stream

  build-rbsigner:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: Build rbsigner
        run: cargo build --package rbsigner --release
      - name: Upload binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/release/rbsigner${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          asset_name: rbsigner-${{ github.ref_name }}-${{ matrix.os }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          asset_content_type: application/octet-stream