# CI pipeline for rustBoot
#
# IMPORTANT: This pipeline must pass before any PR is merged to main.
# All jobs must succeed — CI fails closed.
#
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: Run clippy (rustBoot, nrf52840)
        run: cargo clippy --package rustBoot --all-targets --features nrf52840 -- -D warnings
      - name: Run clippy (rbsigner)
        run: cargo clippy --package rbsigner --all-targets --all-features -- -D warnings
      - name: Run clippy (xtask)
        run: cargo clippy --package xtask --all-targets --features nrf52840 -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check licenses and bans
        run: cargo deny check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate line/branch coverage
        run: cargo llvm-cov --package rustBoot --features "nrf52840,nistp256,sha256" --lcov --output-path lcov.info --fail-under-linenum 26
      - name: Generate MC/DC coverage
        run: cargo llvm-cov --package rustBoot --features "nrf52840,nistp256,sha256" --mcdc --output-path mcdc.json
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: device-tree - unit tests
        run: cargo test --package rustBoot --lib -- --nocapture
      - name: rustBoot image parser - unit tests
        run: |
          cargo test --package rustBoot --lib --features nrf52840 -- parser::tests --nocapture
          cargo test --package rustBoot --lib --features stm32f411 -- parser::tests --nocapture
          cargo test --package rustBoot --lib --features stm32f446 -- parser::tests --nocapture
          cargo test --package rustBoot --lib --features stm32f469 -- parser::tests --nocapture
          cargo test --package rustBoot --lib --features stm32h723 -- parser::tests --nocapture
          cargo test --package rustBoot --lib --features stm32f746 -- parser::tests --nocapture
          cargo test --package rustBoot --lib --features stm32f334 -- parser::tests --nocapture
          cargo test --package rustBoot --lib --features rp2040 -- parser::tests --nocapture

  builds:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        target: [thumbv7em-none-eabihf, aarch64-unknown-none-softfloat, thumbv6m-none-eabi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: Install flip-link
        run: cargo install flip-link --locked
      - name: Install cargo-binutils
        run: |
          cargo install cargo-binutils --locked
          rustup component add llvm-tools-preview
      - name: nrf52840
        if: matrix.target == 'thumbv7em-none-eabihf'
        run: cargo run -p xtask --features nrf52840 -- nrf52840 build rustBoot-only
      - name: stm32f411
        if: matrix.target == 'thumbv7em-none-eabihf'
        run: cargo run -p xtask --features stm32f411 -- stm32f411 build rustBoot-only
      - name: stm32f446
        if: matrix.target == 'thumbv7em-none-eabihf'
        run: cargo run -p xtask --features stm32f446 -- stm32f446 build rustBoot-only
      - name: stm32f469
        if: matrix.target == 'thumbv7em-none-eabihf'
        run: cargo run -p xtask --features stm32f469 -- stm32f469 build rustBoot-only
      - name: stm32h723
        if: matrix.target == 'thumbv7em-none-eabihf'
        run: cargo run -p xtask --features stm32h723 -- stm32h723 build rustBoot-only
      - name: stm32f746
        if: matrix.target == 'thumbv7em-none-eabihf'
        run: cargo run -p xtask --features stm32f746 -- stm32f746 build rustBoot-only
      - name: stm32f334
        if: matrix.target == 'thumbv7em-none-eabihf'
        run: cargo run -p xtask --features stm32f334 -- stm32f334 build rustBoot-only
      - name: rp2040
        if: matrix.target == 'thumbv6m-none-eabi'
        run: cargo run -p xtask --features rp2040 -- rp2040 build rustBoot-only
      - name: rpi4
        if: matrix.target == 'aarch64-unknown-none-softfloat'
        run: cargo run -p xtask -- rpi4 build rustBoot-only

  binary-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: Build release (stm32f411)
        run: |
          cargo run -p xtask --features stm32f411 -- stm32f411 build rustBoot-only
          ls -la boards/target/thumbv7em-none-eabihf/release/rustBoot 2>/dev/null || true
      - name: Check binary size
        run: |
          SIZE=$(stat --format=%s boards/target/thumbv7em-none-eabihf/release/rustBoot 2>/dev/null || echo 0)
          echo "Binary size: $SIZE bytes"
          # Warn if binary exceeds 64KB
          if [ "$SIZE" -gt 65536 ]; then
            echo "WARNING: Binary size $SIZE exceeds 64KB"
          fi

  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Kani
        run: cargo install kani-verifier
      - name: Run Kani proofs
        run: cargo kani --workspace 2>&1 | tail -20

  qemu:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Build firmware
        run: cargo run -p xtask --features stm32f411 -- stm32f411 build rustBoot-only
      - name: Run in QEMU
        run: ./scripts/qemu_test.sh

  stack-analysis:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: Install cargo-call-stack
        run: cargo install cargo-call-stack --locked
      - name: Analyze stack usage (stm32f411)
        run: ./scripts/stack_analysis.sh thumbv7em-none-eabihf "stm32f411,nistp256,sha256"
      - name: Analyze stack usage (nrf52840)
        run: ./scripts/stack_analysis.sh thumbv7em-none-eabihf "nrf52840,nistp256,sha256"