[package]
name = "memchr"
version = "2.8.1"
edition = "2021"
rust-version = "1.61"
description = "Provides extremely fast routines for byte search."
license = "Unlicense OR MIT"

[dependencies]
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
log = { version = "0.4.20", optional = true }

[features]
default = []
alloc = []
std = ["alloc"]
logging = ["dep:log"]

[lib]
path = "src/lib.rs"
bench = false

[workspace]